<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tria Prima · UI</title>
    <link rel="stylesheet" href="/dev/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* stands in for the WebGL canvas */
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* dev only: jump between scenes. Hidden with ?still=1 (captures). */
      #dev-pick {
        position: fixed;
        right: 6px;
        top: 6px;
        z-index: 99;
        font: 11px/1.2 system-ui, sans-serif;
        color: #bbb;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        opacity: 0.25;
      }
      #dev-pick:hover,
      #dev-pick:focus {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="ui"></div>
    <select id="dev-pick" hidden aria-label="Scene"></select>
    <script type="module" src="/dev/ui.js"></script>
  </body>
</html>
