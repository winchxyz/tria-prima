<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tria Prima world viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050608;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 8px;
        color: #cfd3da;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "cannon-es": "/node_modules/cannon-es/dist/cannon-es.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module" src="./world.js"></script>
  </body>
</html>
